<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Viewer</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 2rem; background:#f9f9f9;}
    #log {white-space: pre-wrap; background:#fff; border:1px solid #ddd; padding:1rem; height:400px; overflow:auto;}
    input, button {padding:0.5rem; font-size:1rem;}
  </style>
</head>
<body>
  <h1>Server Log Viewer</h1>
  <div>
    <input type="text" id="search" placeholder="Search term (optional)" />
    <button onclick="loadLog()">Refresh Log</button>
    <button onclick="clearLog()" style="margin-left:1rem;">Clear Log</button>
  </div>
  <div id="log"></div>
  <script>
    async function loadLog() {
      const query = document.getElementById('search').value;
      const url = query ? `/log?search=${encodeURIComponent(query)}` : '/log';
      const resp = await fetch(url);
      const text = await resp.text();
      document.getElementById('log').textContent = text || 'No logs yet.';
    }
    async function clearLog() {
      if (!confirm('Are you sure you want to clear the logs?')) return;
      const resp = await fetch('/log', {method: 'DELETE'});
      const text = await resp.text();
      alert(text);
      loadLog();
    }
    // load on page load
    loadLog();
  </script>
</body>
</html>
